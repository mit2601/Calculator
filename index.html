<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="calc">
      <h2>Calculator</h2>
      <input id="display" type="text" placeholder="0" disabled>
      <div class="buttons">
        <button class="clear">C</button>
      <button>7</button>
      <button>8</button>
      <button>9</button>

      <button class="operator">/</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button class="operator">*</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button class="operator">-</button>

      <button>0</button>
      <button>.</button>
      <button class="equals">=</button>
      
      <button class="operator">+</button>
      <div class="logo">
       Xenabler
      </div>

      </div>

    </div>
    <script src="./scrpt.js"></script>
</body>
</html>
